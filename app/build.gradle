apply plugin: 'com.android.application'

android {
    namespace 'com.example.nasmovie'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('../nasmovie-key.jks')
            storePassword 'nasmovie123'
            keyAlias 'nasmovie'
            keyPassword 'nasmovie123'
        }
    }

    defaultConfig {
        applicationId "com.example.nasmovie"
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName "1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 支持 16KB 页面大小 (Android 15+)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 显示 deprecation 警告
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    // 支持 16KB 页面大小设备 (Android 15+)
    // 注意: VLC 库 (libvlc.so, libvlcjni.so) 目前未按 16KB 对齐
    // 需要等待 VLC 更新修复
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // 如果需要在 Play Store 发布，暂时降级 targetSdk
    // 或者等待 VLC 4.x 正式版支持 16KB 页面大小
}

dependencies {
    // SMB协议
    implementation 'com.hierynomus:smbj:0.13.0'

    // ExoPlayer (Media3) - 替代 VLC，体积更小
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // 数据库
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // UI组件
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'

    // JSON解析
    implementation 'com.google.code.gson:gson:2.10.1'

    // AndroidX核心
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // 测试
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}