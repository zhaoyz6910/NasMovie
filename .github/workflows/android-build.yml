name: Android Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 缓存 Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 授权 Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 创建签名配置文件（从 Secrets 读取）
      - name: Create keystore.properties
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "storeFile=nasmovie-key.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      # 6. 解码并创建签名文件
      - name: Decode keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > nasmovie-key.jks

      # 7. 运行单元测试
      - name: Run unit tests
        run: ./gradlew test

      # 8. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 9. 构建 Release APK（仅在打 tag 时）
      - name: Build Release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease

      # 10. 上传 Debug APK 作为构建产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 11. 获取提交日志
      - name: Generate Changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          # 获取上一个标签
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # 如果没有上一个标签，获取所有提交
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s" --no-merges >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            # 获取两个标签之间的提交
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s" --no-merges ${PREV_TAG}..HEAD >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # 12. 创建 Release 并上传（仅在打 tag 时）
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          name: "NasMovie ${{ github.ref_name }}"
          body: |
            ## NAS 影视管理应用 ${{ github.ref_name }}

            ### 本次更新
            ${{ steps.changelog.outputs.commits }}

            ### 安装说明
            - 下载 APK 文件安装
            - 需要 Android 8.0 (API 26) 或更高版本

            ### 主要功能
            - SMB 协议连接 NAS
            - 影视文件管理与播放
            - 海报墙展示
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 13. 清理签名文件
      - name: Cleanup
        if: always()
        run: |
          rm -f keystore.properties nasmovie-key.jks
